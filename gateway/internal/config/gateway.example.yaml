# gateway.yaml -- OpenRouter Switch gateway config ('openrouter-switch config init' writes exactly this file).
# Field reference: config/schema.md.
# Topology: harness -> door 127.0.0.1:45271 -> router 127.0.0.1:45272.
# ${VAR} resolves from the environment, then ~/.config/openrouter-switch/env (mode 0600); no secrets live here.

global:
  # One global switch. Off is absolute native passthrough; On applies saved routing policy.
  # Fresh installs start native-only. Select an eligible account model in the
  # app before turning OpenRouter routing on.
  routing_enabled: false

  # OpenRouter auth is resolved from Keychain first, then OPENROUTER_API_KEY.
  # Never put an OpenRouter key in this file. Native fallback credentials may
  # use secret references.
  auth:
    anthropic: ${ANTHROPIC_API_KEY}

  # Private segmented JSONL request store; the dashboards read it.
  telemetry_dir: ~/.config/openrouter-switch/telemetry
  telemetry_enabled: true
  telemetry_retention_days: 90

  # Retry and timeout knobs shared by all harnesses.
  retry_max: 3
  request_timeout: 600s
  # Per-attempt first-byte deadline; expiry falls through to fallback_route. 0/absent = disabled.
  # ttft_timeout: 30s

clients:
  # One entry per harness; entries share one router listener (dispatch by path).

  - name: claude-code
    enabled: true
    bind_addr: 127.0.0.1:45272
    protocol_shape: anthropic
    # What the harness sends to the gateway (collected, not yet enforced).
    auth_token:
      header: Authorization
      value: ${ANTHROPIC_AUTH_TOKEN}
    # Select default_model and optional family routes from the authenticated
    # account catalog in the app. No provider slug is assumed for a new account.
    # Picker-visible aliases are synthesized from the authenticated
    # account catalog. Saved models missing from that catalog are unavailable.
    # Route Claude Code subagent (sidechain) traffic to a model; toggle with
    # 'openrouter-switch claude subagents'. See the subagent-routing contract.
    # subagent_model: author/account-available-model
    # subagent_routing: on
    # Tried when openrouter is unreachable, returns 429/5xx, or ttft_timeout expires (30s cooldown).
    fallback_route: anthropic

  # codex ships parked (enabled: false; no listener bound); 'openrouter-switch codex on' offers to
  # enable it, or set enabled: true and SIGHUP the router yourself.
  - name: codex
    enabled: false
    bind_addr: 127.0.0.1:45272
    protocol_shape: openai
    auth_token:
      header: Authorization
      value: ${CODEX_AUTH_TOKEN}
    # Set with 'openrouter-switch codex route <account-model>' before enabling.
    # Responses request normalization and stream consistency safeguards.
    # The additional_tools rewrite is experimental and must be opted into.
    responses_compatibility:
      text_format_default: on
      additional_tools_input: off
      reasoning_effort: on
      function_arguments_consistency: on
    # Emergency only. Empty means no tool types are removed.
    responses_strip_tool_types: []
    fallback_route: openai

# Front-door ports: harnesses point at bind_addr; forwards to router_addr, serves the native provider when tripped.
door:
  cooldown: 15s
  probe_interval: 3s
  ports:
    - bind_addr: 127.0.0.1:45271
      router_addr: 127.0.0.1:45272

# Additional door ports may target separate router listeners when needed.
